<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>后台访问 - MusicForUrl</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/password.css">
</head>
<body>
  <div class="password-container">
    <div class="password-card">
      <div class="password-brand">MFU</div>
      <div id="passwordModeBadge" class="password-badge">安全访问</div>
      <h1 id="passwordTitle" class="password-title">后台密钥登录</h1>
      <p id="passwordDesc" class="password-desc">请输入后台密钥后继续访问。</p>
      
      <form id="passwordForm" class="password-form" onsubmit="return handleSubmit(event)">
        <input 
          type="password" 
          id="passwordInput" 
          class="password-input" 
          placeholder="请输入后台密钥"
          autocomplete="current-password"
          autofocus
        >
        <input
          type="password"
          id="passwordConfirmInput"
          class="password-input"
          placeholder="再次输入后台密钥"
          autocomplete="new-password"
          hidden
        >
        <button id="passwordSubmit" type="submit" class="btn btn-primary password-submit">
          登录后台
        </button>
        <p id="passwordHint" class="password-hint" hidden>密钥至少需要 8 个字符，请妥善保存；系统只保存安全哈希，无法找回原文。</p>
        <p id="errorMessage" class="error-message" role="alert"></p>
      </form>
    </div>
  </div>

  <script src="/js/error-utils.js"></script>
  <script src="/js/password.js"></script>
</body>
</html>
